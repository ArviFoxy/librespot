// Extracted from: Spotify 1.3.4.258 (linux)

syntax = "proto3";

package spotify.playlistmixing.extensions.audio_attributes.v2;

option optimize_for = CODE_SIZE;

message AudioAttributes {
    message Key {
        enum Mode {
            MODE_UNKNOWN = 0;
            MODE_MINOR = 1;
            MODE_MAJOR = 2;
        }

        message CamelotKey {
            string value = 1;
            string color = 2;
        }

        string key = 1;
        Mode mode = 2;
        CamelotKey camelot_key = 3;
    }

    double bpm = 1;
    Key key = 2;
}
