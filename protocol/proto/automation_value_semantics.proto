message AutomationInterpolationSegment {
    double raw_start = 1;
    double raw_end = 2;
    double output_start = 3;
    double output_end = 4;
    AutomationValueMode output_mode = 10;
    oneof output_interpolation {
        AutomationLinearInterpolation linear = 5;
        AutomationSignedGeometricInterpolation signed_geometric = 6;
    }
    oneof easing {
        AutomationLinearEasing no_easing = 7;
        AutomationPowerEasing power_in = 8;
        AutomationPowerEasing power_out = 9;
